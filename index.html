<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle ambient background glow elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.15;
            filter: blur(80px);
            z-index: -1;
        }
        body::before { top: 10%; left: 15%; }
        body::after { bottom: 10%; right: 15%; }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            margin-bottom: 48px;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Countdown Container */
        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 48px;
        }

        .countdown-card {
            background: var(--card-bg);
            padding: 20px 10px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .time-num {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--text-main);
            display: block;
            line-height: 1;
            margin-bottom: 4px;
        }

        .time-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Subscription Form */
        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 40px;
        }

        @media (min-width: 480px) {
            .subscribe-form {
                flex-direction: row;
                background: var(--card-bg);
                padding: 6px;
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        .subscribe-form input[type="email"] {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            flex-grow: 1;
            transition: border-color 0.2s;
        }

        @media (min-width: 480px) {
            .subscribe-form input[type="email"] {
                background: transparent;
                border: none;
            }
        }

        .subscribe-form input[type="email"]:focus {
            border-color: var(--accent);
        }

        .subscribe-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .subscribe-form button:hover {
            background: var(--accent-hover);
        }

        footer {
            margin-top: auto;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">PROJECT<span>NAME</span></div>
        
        <h1>Something beautiful is coming.</h1>
        <p class="subtitle">We're working hard to give you the best experience. Sign up to get notified the moment we go live.</p>

        <!-- Live Countdown Timer -->
        <div class="countdown-container">
            <div class="countdown-card">
                <span class="time-num" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="countdown-card">
                <span class="time-num" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="countdown-card">
                <span class="time-num" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="countdown-card">
                <span class="time-num" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <!-- Notification Sign Up Form -->
        <form class="subscribe-form" action="#" method="POST" onsubmit="handleSubscribe(event)">
            <input type="email" placeholder="Enter your email address" required autocomplete="off">
            <button type="submit">Notify Me</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Your Company. All rights reserved.
    </footer>

    <script>
        // Set the Target Launch Date (Format: "Month DD, YYYY HH:MM:SS")
        // Update this date to your actual expected launch deadline
        const launchDate = new Date("December 31, 2026 00:00:00").getTime();

        const countdown = setInterval(() => {
            const now = new Date().getTime();
            const distance = launchDate - now;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the results in the respective elements, enforcing double-digit formatting
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // If the countdown is finished, display zeros or a custom message
            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.querySelector("h1").innerText = "We are officially live!";
            }
        }, 1000);

        // Simple local presentation logic for form submission
        function handleSubscribe(event) {
            event.preventDefault();
            const emailInput = event.target.querySelector('input[type="email"]');
            alert(`Thank you! ${emailInput.value} has been added to our notification list.`);
            emailInput.value = '';
        }
    </script>
</body>
</html>
