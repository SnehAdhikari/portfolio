<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sneh Adhikari — Network Engineer</title>
<meta name="description" content="Network engineer based in Kathmandu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F4; --panel:#FFFFFF; --panel-2:#F2EFE9;
  --line:#E6E1D8; --line-soft:#EEEAE1;
  --ink:#1E1C1A; --ink-soft:#6B6761; --accent:#2D7D7B; --accent-soft:#E8F3F2;
  --amber:#B8860B; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(30,28,26,.04), 0 4px 12px rgba(30,28,26,.05);
  --shadow-hover:0 4px 16px rgba(30,28,26,.08), 0 12px 32px rgba(30,28,26,.08);
  --card-pad:28px; --grid-gap:24px;
  --container:1200px;
  --container-pad:40px;
  --section-top:88px;
  --section-bottom:80px;
}
:root[data-theme="dark"]{
  --bg:#121110; --panel:#1C1A18; --panel-2:#242220;
  --line:#2E2B28; --line-soft:#262320;
  --ink:#F0EDE8; --ink-soft:#A09B94; --accent:#5BB8B6; --accent-soft:#1A2E2D;
  --amber:#D4A843; --on-accent:#121110;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.2);
  --shadow-hover:0 4px 16px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
*,*::before,*::after{transition:background-color .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease, transform .2s ease;}
html{scroll-behavior:smooth; scroll-padding-top:96px;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
.wrap{max-width:var(--container); margin:0 auto; padding:0 var(--container-pad);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-.02em; font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}

/* NAV */
nav{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line-soft);}
nav .bar{display:flex; align-items:center; gap:28px; height:68px;}
nav .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; text-decoration:none; letter-spacing:-.02em; margin-right:auto;}
nav .brand span{color:var(--accent);}
nav ul{list-style:none; display:flex; gap:28px; margin:0; padding:0; font-size:14px;}
nav a{text-decoration:none; color:var(--ink-soft);}
nav a:hover{color:var(--ink);}
.theme-toggle{position:relative; width:54px; height:29px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); cursor:pointer; padding:0; flex-shrink:0;}
.theme-toggle .tt-track{display:flex; align-items:center; justify-content:space-between; height:100%; padding:0 8px; font-size:12px;}
.theme-toggle .tt-knob{position:absolute; top:2px; left:2px; width:23px; height:23px; border-radius:50%; background:var(--accent); transition:transform .3s cubic-bezier(.4,0,.2,1); box-shadow:0 2px 6px rgba(45,125,123,.3);}
:root[data-theme="dark"] .theme-toggle .tt-knob{transform:translateX(25px);}
@media (max-width:900px){ nav ul{display:none;} nav .bar{gap:0;} }

/* HERO */
header.hero{padding:80px 0 72px;}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:64px; align-items:center;}
.eyebrow{font-size:13.5px; color:var(--accent); margin-bottom:20px; display:flex; align-items:center; gap:10px; font-weight:500;}
.eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);}
h1.name{font-size:clamp(30px,4.2vw,52px); line-height:1.1; margin-bottom:20px; letter-spacing:-.03em; font-weight:700;}
h1.name em{font-style:normal; color:var(--accent);}
.hero p.lede{color:var(--ink-soft); font-size:clamp(15px,1.15vw,17px); max-width:56ch; margin:0 0 32px; line-height:1.7;}
.hero p.lede strong{color:var(--ink); font-weight:500;}
.cta-row{display:flex; gap:12px; flex-wrap:wrap;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:9px; font-size:14.5px; font-weight:600; text-decoration:none; transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease, color .2s ease; border:none; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--accent); color:var(--on-accent);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(45,125,123,.3);}
.btn-ghost{border:1px solid var(--line); color:var(--ink); background:transparent;}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.btn svg{flex-shrink:0;}

/* CONSOLE */
.console{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-hover);}
.console .bar2{display:flex; gap:6px; padding:14px 20px; border-bottom:1px solid var(--line-soft);}
.console .bar2 span{width:10px; height:10px; border-radius:50%; background:var(--line);}
.console .body{padding:22px 24px; font-size:13px; line-height:1.75; overflow-x:auto;}
.console .ln{margin-bottom:10px; color:var(--ink-soft);}
.console .ln:last-child{margin-bottom:0;}
.console .ln b{color:var(--ink); font-weight:500;}
.console .tag2{color:var(--amber);}
.console .val{color:var(--accent);}

/* SECTIONS */
section{padding:var(--section-top) 0 var(--section-bottom); border-bottom:1px solid var(--line-soft);}
section:last-of-type{border-bottom:none; padding-bottom:calc(var(--section-bottom) + 24px);}

.section-head{margin-bottom:44px;}
.section-head .eyebrow-sm{font-size:12.5px; color:var(--accent); font-weight:600; margin-bottom:14px; letter-spacing:.06em; text-transform:uppercase;}
.section-head h2{font-size:clamp(22px,2.4vw,30px); letter-spacing:-.025em; margin:0;}
.section-head .section-sub{color:var(--ink-soft); font-size:15.5px; max-width:66ch; margin:14px 0 0; line-height:1.75;}

/* ABOUT */
.about-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:56px; align-items:start;}
.about-grid p{color:var(--ink-soft); font-size:16px; margin:0 0 20px; line-height:1.8;}
.about-grid p:last-child{margin-bottom:0;}
.about-grid p:first-child{color:var(--ink); font-size:16.5px; line-height:1.75;}
.about-facts{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:var(--card-pad); box-shadow:var(--shadow);}
.about-facts h3{font-size:11.5px; color:var(--accent); font-family:'IBM Plex Mono',monospace; margin:0 0 20px; letter-spacing:.1em; font-weight:500; text-transform:uppercase;}
.about-facts ul{list-style:none; margin:0; padding:0; font-size:14.5px;}
.about-facts li{padding:12px 0; border-bottom:1px dashed var(--line-soft); color:var(--ink-soft); display:flex; justify-content:space-between; gap:16px; line-height:1.55;}
.about-facts li:first-child{padding-top:0;}
.about-facts li:last-child{border-bottom:none; padding-bottom:0;}
.about-facts li strong{color:var(--ink); font-weight:500; text-align:right;}

/* SKILLS */
.skills-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--grid-gap);}
.skill-group{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:var(--card-pad); display:flex; flex-direction:column;}
.skill-group h3{font-size:13px; color:var(--accent); font-family:'IBM Plex Mono',monospace; margin:0 0 20px; letter-spacing:.06em; font-weight:500; text-transform:uppercase;}
.skill-tags{display:flex; flex-wrap:wrap; gap:8px;}
.skill-tag{font-size:13px; padding:7px 14px; border-radius:20px; background:var(--panel-2); color:var(--ink-soft); border:1px solid var(--line-soft); line-height:1.4;}

/* EXPERIENCE */
.timeline{position:relative; padding-left:32px;}
.timeline::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px; background:var(--line-soft); border-radius:2px;}
.tl-item{position:relative; padding-bottom:44px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:""; position:absolute; left:-37px; top:7px; width:12px; height:12px; border-radius:50%; background:var(--bg); border:2.5px solid var(--accent); z-index:1;}
.tl-head{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline; margin-bottom:6px;}
.tl-role{font-weight:600; font-size:17px; font-family:'Space Grotesk',sans-serif; letter-spacing:-.015em;}
.tl-date{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; font-family:'IBM Plex Mono',monospace;}
.tl-org{color:var(--accent); font-size:14.5px; margin:2px 0 14px; font-weight:500;}
.tl-item ul{margin:0; padding-left:20px; color:var(--ink-soft); font-size:14.5px;}
.tl-item li{margin-bottom:8px; line-height:1.7;}
.tl-item li:last-child{margin-bottom:0;}

/* PROJECTS */
.proj-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--grid-gap);}
.proj-card{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:var(--card-pad); display:flex; flex-direction:column; transition:border-color .25s ease, box-shadow .25s ease;}
.proj-card:hover{border-color:var(--accent); box-shadow:var(--shadow-hover);}
.proj-card h3{font-size:16.5px; margin:0 0 12px; letter-spacing:-.015em;}
.proj-card p{color:var(--ink-soft); font-size:14.5px; margin:0; line-height:1.7;}
.proj-tags{font-size:11.5px; color:var(--amber); font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; padding-top:16px; margin-top:20px; border-top:1px dashed var(--line-soft);}

/* CERTIFICATIONS */
.cert-list{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
.cert-list li{background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; transition:border-color .25s ease, box-shadow .25s ease;}
.cert-list li:hover{border-color:var(--accent); box-shadow:var(--shadow);}
.cert-card{display:flex; align-items:center; gap:14px; padding:18px 22px; text-decoration:none; color:inherit; width:100%;}
.cert-badge{width:34px; height:34px; border-radius:6px; object-fit:contain; flex-shrink:0; background:var(--panel-2); padding:3px;}
.cert-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-left:3px;}
.cert-info{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0;}
.cert-name{font-size:14.5px; line-height:1.4; font-weight:500; color:var(--ink);}
.cert-issuer{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
.cert-arrow{color:var(--ink-soft); flex-shrink:0; transition:color .2s ease, transform .2s ease;}
.cert-card:hover .cert-arrow{color:var(--accent); transform:translate(2px,-2px);}

@media (max-width:640px){
  .cert-list{grid-template-columns:1fr;}
}
/* EDUCATION */
.edu-list{list-style:none; margin:0; padding:0; display:grid; gap:16px;}
.edu-list li{background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:var(--card-pad);}
.edu-list h3{font-size:16px; margin:0 0 8px; letter-spacing:-.015em;}
.edu-list p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.65;}

/* CONTACT */
.contact-grid{display:grid; grid-template-columns:1fr 1.2fr; gap:56px; align-items:start;}
.contact-info p{color:var(--ink-soft); font-size:15.5px; max-width:46ch; margin:0 0 28px; line-height:1.75;}
.contact-buttons{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px;}
.contact-meta{font-size:13.5px; color:var(--ink-soft); display:flex; align-items:center; gap:9px;}
.contact-meta .pin{width:6px; height:6px; border-radius:50%; background:var(--amber); flex-shrink:0;}
form{display:flex; flex-direction:column; gap:20px;}
.field{display:flex; flex-direction:column; gap:8px;}
.field label{font-size:12.5px; color:var(--ink-soft); font-weight:500;}
.field input, .field textarea{background:var(--panel); border:1px solid var(--line-soft); border-radius:10px; padding:14px 16px; color:var(--ink); font-family:'Inter',sans-serif; font-size:15px; resize:vertical; width:100%;}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);}
.field input::placeholder, .field textarea::placeholder{color:var(--ink-soft); opacity:.6;}
.form-note{font-size:12.5px; color:var(--ink-soft); margin:0;}
.form-status{font-size:14px; margin:0; display:none; padding:12px 16px; border-radius:8px;}
.form-status.ok{background:var(--accent-soft); color:var(--accent); display:block; font-weight:500;}
.form-status.err{background:#FEF2F2; color:#DC2626; display:block;}
:root[data-theme="dark"] .form-status.err{background:#2A1515; color:#F87171;}
button.submit{align-self:flex-start; font-family:'Inter',sans-serif;}

footer{padding:48px 0 56px;}
footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--ink-soft);}

a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{transition:none !important;} }

/* ============================================================
   RESPONSIVE LADDER
   Desktop      : > 1200px  (default)
   Laptop       : 1024–1200
   Tablet       : 768–1024
   Small tablet : 600–768
   Phone        : 480–600
   Small phone  : < 480
   ============================================================ */

/* Laptop — slightly tighter */
@media (max-width:1200px){
  :root{--container-pad:36px; --section-top:80px; --section-bottom:72px;}
}

/* Tablet landscape */
@media (max-width:1024px){
  :root{--container-pad:32px; --section-top:72px; --section-bottom:64px;}
  .hero-grid{gap:48px;}
  .about-grid{gap:40px;}
  .contact-grid{gap:40px;}
}

/* Tablet portrait — hero & grids stack */
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr; gap:40px;}
  header.hero{padding:64px 0 56px;}
  .about-grid{grid-template-columns:1fr; gap:32px;}
  .contact-grid{grid-template-columns:1fr; gap:40px;}
}

/* Small tablet */
@media (max-width:768px){
  :root{--container-pad:28px; --section-top:64px; --section-bottom:56px; --card-pad:24px; --grid-gap:18px;}
  .section-head{margin-bottom:36px;}
  .skills-grid{grid-template-columns:1fr;}
  .proj-grid{grid-template-columns:1fr;}
  nav ul{display:none;}
}

/* Phone */
@media (max-width:600px){
  :root{--container-pad:22px; --section-top:56px; --section-bottom:48px; --card-pad:22px; --grid-gap:16px;}
  header.hero{padding:48px 0 48px;}
  h1.name{font-size:clamp(26px,7.5vw,36px);}
  .hero p.lede{font-size:15.5px;}
  .cta-row{gap:10px;}
  .btn{padding:11px 18px; font-size:14px;}
  .section-head{margin-bottom:32px;}
  .section-head h2{font-size:22px;}
  .section-head .section-sub{margin-top:12px; font-size:14.5px;}
  .console .body{font-size:12px; padding:18px 18px;}
  .cert-list{grid-template-columns:1fr;}
  .tl-item{padding-bottom:32px;}
  .tl-head{gap:4px;}
  .tl-date{font-size:12px;}
  form{gap:16px;}
  footer{padding:40px 0 48px;}
}

/* Small phone */
@media (max-width:400px){
  :root{--container-pad:18px; --section-top:48px; --section-bottom:40px; --card-pad:20px;}
  h1.name{font-size:26px;}
  .hero p.lede{font-size:15px;}
  .btn{padding:10px 16px; font-size:13.5px;}
  .console .body{font-size:11.5px;}
  .about-facts{padding:20px;}
  .about-facts li{font-size:13.5px;}
  .skill-tag{font-size:12px; padding:6px 12px;}
  .tl-role{font-size:15.5px;}
}
</style>
</head>
<body>

<nav>
  <div class="wrap bar">
    <a href="#" class="brand" id="brand"></a>
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#certifications">Certs</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
      <span class="tt-track"><span>☀️</span><span>🌙</span></span>
      <span class="tt-knob"></span>
    </button>
  </div>
</nav>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow"><span class="dot"></span><span id="availability"></span></div>
      <h1 class="name" id="heroTitle"></h1>
      <p class="lede" id="heroLede"></p>
      <div class="cta-row">
        <a class="btn btn-primary" href="#contact" id="ctaPrimary"></a>
        <a class="btn btn-ghost" href="#projects" id="ctaSecondary"></a>
      </div>
    </div>
    <div class="console">
      <div class="bar2"><span></span><span></span><span></span></div>
      <div class="body mono" id="consoleBody"></div>
    </div>
  </div>
</header>

<main>

<section id="about">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">About</div>
      <h2 id="aboutHeading"></h2>
    </div>
    <div class="about-grid">
      <div id="aboutBody"></div>
      <div class="about-facts">
        <h3>At a glance</h3>
        <ul id="aboutFacts"></ul>
      </div>
    </div>
  </div>
</section>

<section id="skills">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Skills</div>
      <h2 id="skillsHeading"></h2>
      <p class="section-sub" id="skillsSub"></p>
    </div>
    <div class="skills-grid" id="skillsGrid"></div>
  </div>
</section>

<section id="experience">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Experience</div>
      <h2 id="expHeading"></h2>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<section id="projects">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Projects</div>
      <h2 id="projHeading"></h2>
      <p class="section-sub" id="projSub"></p>
    </div>
    <div class="proj-grid" id="projGrid"></div>
  </div>
</section>

<section id="certifications">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Certifications</div>
      <h2 id="certHeading"></h2>
    </div>
    <ul class="cert-list" id="certList"></ul>
  </div>
</section>

<section id="education">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Education</div>
      <h2 id="eduHeading"></h2>
    </div>
    <ul class="edu-list" id="eduList"></ul>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow-sm">Contact</div>
      <h2 id="contactHeading"></h2>
    </div>
    <div class="contact-grid">
      <div class="contact-info">
        <p id="contactMessage"></p>
        <div class="contact-buttons">
          <a class="btn btn-primary" id="emailBtn" href="#">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Email me
          </a>
          <a class="btn btn-ghost" id="linkedinBtn" href="#" target="_blank" rel="noopener">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
            LinkedIn
          </a>
        </div>
        <p class="contact-meta"><span class="pin"></span><span id="contactLocation"></span></p>
      </div>
      <form id="contactForm" action="" method="POST">
        <input type="hidden" name="_subject" value="Enquiry from website">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" style="display:none">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" required placeholder="Your name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="you@example.com"></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" required placeholder="A sentence or two is fine."></textarea></div>
        <button class="btn btn-primary submit" type="submit">Send message</button>
        <p class="form-status" id="formStatus"></p>
        <p class="form-note">Goes straight to my inbox. I reply within a day.</p>
      </form>
    </div>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> <span id="footerName"></span></span>
    <span id="footerLocation"></span>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadJSON(path){
  const res = await fetch(path + '?v=' + Date.now());
  if(!res.ok) throw new Error(path + ' failed: ' + res.status);
  return res.json();
}

(async function init(){
  try {
    const [profile, skills, experience, projects, certifications, education] = await Promise.all([
      loadJSON('content/profile.json'),
      loadJSON('content/skills.json'),
      loadJSON('content/experience.json'),
      loadJSON('content/projects.json'),
      loadJSON('content/certifications.json'),
      loadJSON('content/education.json')
    ]);

    $('brand').innerHTML = esc(profile.brandPrefix) + '<span>' + esc(profile.brandAccent) + '</span>';

    $('availability').textContent = profile.availability || '';
    const titleParts = (profile.heroTitle || '').split(profile.heroTitleEmphasis || '__NOPE__');
    $('heroTitle').innerHTML = titleParts.map(esc).join('<em>' + esc(profile.heroTitleEmphasis) + '</em>');
    $('heroLede').innerHTML = esc(profile.heroLede || '').replace(/&lt;strong&gt;/g,'<strong>').replace(/&lt;\/strong&gt;/g,'</strong>');
    $('ctaPrimary').textContent = profile.ctaPrimary || 'Get in touch';
    $('ctaSecondary').textContent = profile.ctaSecondary || 'View projects';

    let consoleHTML = '';
    consoleHTML += '<div class="ln">$ whoami</div>';
    consoleHTML += '<div class="ln"><b>' + esc(profile.name) + '</b> — ' + esc(profile.role) + '</div>';
    consoleHTML += '<div class="ln">$ currently</div>';
    consoleHTML += '<div class="ln"><span class="val">' + esc(profile.currently) + '</span></div>';
    consoleHTML += '<div class="ln">$ focus</div>';
    (profile.focus || []).forEach(f => {
      consoleHTML += '<div class="ln"><span class="tag2">' + esc(f.label) + '</span> <span class="val">' + esc(f.value) + '</span></div>';
    });
    $('consoleBody').innerHTML = consoleHTML;

    $('aboutHeading').textContent = profile.aboutHeading || 'A bit about me';
    $('aboutBody').innerHTML = (profile.about || []).map(p => '<p>' + esc(p) + '</p>').join('');
    $('aboutFacts').innerHTML = (profile.facts || []).map(f =>
      '<li><span>' + esc(f.label) + '</span><strong>' + esc(f.value) + '</strong></li>'
    ).join('');

    $('skillsHeading').textContent = profile.skillsHeading || 'What I work with';
    $('skillsSub').textContent = profile.skillsSub || '';
    $('skillsGrid').innerHTML = skills.map(g =>
      '<div class="skill-group"><h3>' + esc(g.group) + '</h3><div class="skill-tags">' +
      g.items.map(i => '<span class="skill-tag">' + esc(i) + '</span>').join('') +
      '</div></div>'
    ).join('');

    $('expHeading').textContent = profile.expHeading || "Where I've worked";
    $('timeline').innerHTML = experience.map(e =>
      '<div class="tl-item">' +
        '<div class="tl-head"><span class="tl-role">' + esc(e.role) + '</span><span class="tl-date">' + esc(e.date) + '</span></div>' +
        '<div class="tl-org">' + esc(e.company) + '</div>' +
        '<ul>' + e.bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' +
      '</div>'
    ).join('');

    $('projHeading').textContent = profile.projHeading || "Things I've worked on";
    $('projSub').textContent = profile.projSub || '';
    $('projGrid').innerHTML = projects.map(p =>
      '<div class="proj-card"><h3>' + esc(p.title) + '</h3><p>' + esc(p.description) + '</p>' +
      '<div class="proj-tags">' + esc(p.tags) + '</div></div>'
    ).join('');

    $('certHeading').textContent = profile.certHeading || "What I'm certified in";
    $('certList').innerHTML = certifications.map(function(c){
  var name   = typeof c === 'string' ? c : (c.name || '');
  var issuer = (typeof c === 'string') ? '' : (c.issuer || '');
  var url    = (typeof c === 'string') ? '' : (c.url || '');
  var badge  = (typeof c === 'string') ? '' : (c.badge || '');

  var badgeHTML = badge
    ? '<img class="cert-badge" src="' + esc(badge) + '" alt="" loading="lazy">'
    : '<span class="cert-dot"></span>';

  var infoHTML = '<div class="cert-info">' +
    '<span class="cert-name">' + esc(name) + '</span>' +
    (issuer ? '<span class="cert-issuer">' + esc(issuer) + '</span>' : '') +
    '</div>';

  var arrowHTML = url
    ? '<svg class="cert-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>'
    : '';

  if (url) {
    return '<li><a class="cert-card" href="' + esc(url) + '" target="_blank" rel="noopener">' +
           badgeHTML + infoHTML + arrowHTML + '</a></li>';
  }
  return '<li><div class="cert-card">' + badgeHTML + infoHTML + '</div></li>';
}).join('');

    $('eduHeading').textContent = profile.eduHeading || 'Where I studied';
    $('eduList').innerHTML = education.map(e =>
      '<li><h3>' + esc(e.degree) + '</h3><p>' + esc(e.institution) + ' · ' + esc(e.years) + '</p></li>'
    ).join('');

    $('contactHeading').textContent = profile.contactHeading || 'Say hello';
    $('contactMessage').textContent = profile.contactMessage || '';
    $('emailBtn').href = 'mailto:' + profile.email;
    $('linkedinBtn').href = profile.linkedin;
    $('contactLocation').textContent = profile.location;
    $('contactForm').action = 'https://formsubmit.co/' + profile.email;

    $('footerName').textContent = profile.name;
    $('footerLocation').textContent = profile.location;
    document.title = profile.name + ' — ' + profile.role;

  } catch (err) {
    console.error(err);
  }

  $('year').textContent = new Date().getFullYear();
})();

(function(){
  var toggle = $('themeToggle');
  function setTheme(name){
    document.documentElement.setAttribute('data-theme', name);
    try{ localStorage.setItem('portfolio-theme', name); }catch(e){}
  }
  toggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    setTheme(current === 'light' ? 'dark' : 'light');
  });
  var saved = null;
  try{ saved = localStorage.getItem('portfolio-theme'); }catch(e){}
  if(!saved){ saved = 'light'; }
  setTheme(saved);
})();

(function(){
  var form = $('contactForm');
  var status = $('formStatus');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();
    status.className = 'form-status';
    status.textContent = '';
    var data = new FormData(form);
    fetch(form.action, { method:'POST', body:data, headers:{ 'Accept':'application/json' } })
    .then(function(res){
      if(res.ok){
        status.className = 'form-status ok';
        status.textContent = "Thanks — I'll reply within a day.";
        form.reset();
      } else { throw new Error('Failed'); }
    })
    .catch(function(){
      status.className = 'form-status err';
      status.innerHTML = 'Couldn\'t send automatically — <a href="mailto:' + form.action.replace('https://formsubmit.co/','') +
        '?subject=' + encodeURIComponent('Enquiry from ' + name) +
        '&body=' + encodeURIComponent(message + '\n\n— ' + name + ' (' + email + ')') +
        '" style="color:var(--accent);text-decoration:underline;">click here to email me directly</a>.';
    });
  });
})();
</script>

</body>
</html>
